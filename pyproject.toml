[project]
name = "blackbox"
version = "0.1.0"
description = "BlackBox — Autonomous Data Incident Response on DataHub"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "anthropic>=0.40",
    "acryl-datahub[sql-parser]>=1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "requests>=2.32",
    "pytest>=8.3",
    "tenacity>=9.0",
    "mcp>=2.0.0",
    "sqlparse>=0.5.5",
    "datahub-agent-context>=1.6.0.8.post1",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/blackbox"]

[tool.pytest.ini_options]
testpaths = ["pipeline/invariants", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
